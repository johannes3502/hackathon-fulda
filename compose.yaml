name: hackathon-fulda

x-backend: &backend
  image: hackathon-fulda-backend
  init: true
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-trainer}
    POSTGRES_USER: ${POSTGRES_USER:-trainer}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    S3_ENDPOINT_URL: http://storage:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    S3_BUCKET: ${S3_BUCKET:-recordings}
    S3_REGION: us-east-1
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    ASR_PROVIDER: ${ASR_PROVIDER:-whisper}
    WHISPER_MODEL: ${WHISPER_MODEL:-small}
    WHISPER_MODEL_PATH: /app/models/whisper
    WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
    WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-de}
    WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
    WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-false}
    WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-}
    DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
    DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
    WHISPER_LIVE_MODEL: ${WHISPER_LIVE_MODEL:-}
    WHISPER_LIVE_BEAM_SIZE: ${WHISPER_LIVE_BEAM_SIZE:-}
    WHISPER_LIVE_CHUNK_MS: ${WHISPER_LIVE_CHUNK_MS:-2000}
    WHISPER_LIVE_MAX_WINDOW_MS: ${WHISPER_LIVE_MAX_WINDOW_MS:-10000}
    WHISPER_LIVE_MAX_SECONDS: ${WHISPER_LIVE_MAX_SECONDS:-600}
    WHISPER_LIVE_MAX_IDLE_SECONDS: ${WHISPER_LIVE_MAX_IDLE_SECONDS:-30}
    SILERO_MODEL_PATH: /app/models/silero_vad.onnx
    ASR_DEMO_WORDS_PATH: /app/app/demo/words.json
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
    EMBEDDING_MODEL_PATH: /app/models/embedding
    SOURCE_MAX_BYTES: ${SOURCE_MAX_BYTES:-26214400}
    # Heuristic only: vector-only hits below this cosine are marked weak.
    SOURCE_WEAK_SIMILARITY: ${SOURCE_WEAK_SIMILARITY:-0.30}
    LLM_BASE_URL: ${LLM_BASE_URL-https://generativelanguage.googleapis.com/v1beta/openai}
    LLM_MODEL: ${LLM_MODEL-gemini-3.1-flash-lite}
    LLM_API_KEY: ${LLM_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
    LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
    LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-45}
    LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
    WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-none}
    WEB_SEARCH_LANGUAGE: ${WEB_SEARCH_LANGUAGE:-de}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    RETENTION_PROFILE_DAYS: ${RETENTION_PROFILE_DAYS:-365}
    RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-365}
    RETENTION_JOB_DAYS: ${RETENTION_JOB_DAYS:-30}
    RETENTION_STALE_JOB_HOURS: ${RETENTION_STALE_JOB_HOURS:-2}
    RETENTION_BATCH: ${RETENTION_BATCH:-100}
  volumes:
    - ./backend/app:/app/app:ro
    - ./templates:/templates:ro
  depends_on:
    postgres:
      condition: service_healthy
    storage:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./api:/app/api:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const paths=['/','/demo','/gestures','/sources','/progress','/admin','/live','/live/healthcheck/review','/review-preview','/api/health/ready'];(async()=>{for(const path of paths){const response=await fetch('http://127.0.0.1:3000'+path,{signal:AbortSignal.timeout(10000)});if(!response.ok)process.exit(1)}})().then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 150s
      retries: 10
      start_period: 120s

  backend:
    <<: *backend
    build:
      context: ./backend
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10).close()"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    # Reuse the API image; two parallel exporters racing on one tag can fail.
    pull_policy: never
    depends_on:
      backend:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    restart: unless-stopped
    stop_grace_period: 11m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    # Exactly one scheduler. Do not use the worker's -B flag.
    pull_policy: never
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped

  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    # PostgreSQL 18 with the pgvector extension (source chunks + embeddings).
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-ip=storage", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-recordings}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - media_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

volumes:
  postgres_data:
  media_data:
  redis_data:
